<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Playback Stage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 35%22 fill=%22none%22%3E%3Cpath d=%22M28 17.5C21 6 7 4 5 17.5c2 13.5 16 11.5 23 0Z%22 stroke=%22%23397d74%22 stroke-width=%225.5%22 stroke-linejoin=%22round%22 opacity=%22.55%22/%3E%3Cpath d=%22M28 17.5C35 6 49 4 51 17.5c-2 13.5-16 11.5-23 0Z%22 stroke=%22%23397d74%22 stroke-width=%225.5%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="stage.css">
  <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
</head>
<body class="stage-body">
  <header class="st-bar">
    <span class="st-brand">
      <svg class="st-mark" viewBox="0 0 56 35" fill="none" aria-hidden="true"><path d="M28 17.5C21 6 7 4 5 17.5c2 13.5 16 11.5 23 0Z" stroke="var(--accent)" stroke-width="5.5" stroke-linejoin="round" opacity=".55"/><path d="M28 17.5C35 6 49 4 51 17.5c-2 13.5-16 11.5-23 0Z" stroke="var(--accent)" stroke-width="5.5" stroke-linejoin="round"/><path d="M20.5 18.5 27 13h5.5l4.5 3.5-3 5-6.5 4-3-2.5-3.5 1Z" fill="var(--paper)"/><path d="M22 17.5 27.5 13H32l3.5 3.5" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m23 21.5 2.5 2.5M26 20l2.5 2.5M29 18.5l2.5 2.5" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/></svg>
      Playback
    </span>
    <span class="st-badge" id="mock-badge" hidden>Demo audio</span>
    <span class="st-status" id="status"></span>
    <span class="st-pill" id="conn-pill" hidden>Reconnecting…</span>
  </header>

  <main class="st-main">
    <!-- start / idle -->
    <section class="st-view st-start" id="v-start" aria-labelledby="start-line">
      <h1 class="st-start-line" id="start-line">Most tools only look at what you said. Playback looks at how the other person responded.</h1>
      <div class="st-brief" id="start-brief" hidden></div>
      <div class="st-start-foot">
        <span class="st-tag" id="start-tag" hidden></span>
        <span class="st-wait"><span class="st-breath" aria-hidden="true"></span>Waiting for the conversation…</span>
      </div>
    </section>

    <!-- recording + label share the script layout -->
    <section class="st-view st-script" id="v-script" hidden aria-labelledby="script-title">
      <div class="st-script-head">
        <span class="st-rec" id="rec-ind"><span class="st-rec-dot" aria-hidden="true"></span><span class="st-rec-tag" aria-hidden="true">REC</span><span id="rec-word">Recording</span></span>
        <span class="st-timer" id="rec-timer">0:00</span>
        <h1 class="st-script-title" id="script-title"></h1>
        <span class="st-tag" id="script-tag" hidden></span>
      </div>
      <div class="st-scroll st-fade" id="script-scroll">
        <ol class="st-lines" id="script-lines" aria-live="polite"></ol>
      </div>
    </section>

    <!-- coaching -->
    <section class="st-view st-coach" id="v-coach" hidden aria-labelledby="coach-title">
      <div class="st-coach-main">
        <div class="st-coach-head">
          <h1 class="st-coach-title" id="coach-title"></h1>
          <span class="st-tag" id="coach-tag"></span>
        </div>
        <div class="st-processing" id="coach-processing" hidden>
          <span class="st-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Coaching…</span>
        </div>
        <article class="st-note" id="note" hidden>
          <p class="st-note-text" id="note-text"></p>
          <p class="st-note-sugg" id="note-sugg"></p>
        </article>
        <p class="st-dropped" id="note-dropped" hidden></p>
        <section class="st-compare" id="compare" hidden aria-label="Compared with last time"></section>
        <ul class="st-signals" id="signals" aria-label="Your counts"></ul>
      </div>
      <div class="st-coach-side">
        <section class="st-follow" id="follow" hidden aria-label="Follow-up message"></section>
        <section class="st-hooks" id="hooks" hidden aria-label="What we picked up"></section>
        <div class="st-scroll" id="coach-scroll">
          <ol class="st-lines st-lines-compact" id="coach-lines"></ol>
        </div>
      </div>
    </section>

    <!-- memory -->
    <section class="st-view st-memory" id="v-memory" hidden aria-labelledby="memory-title">
      <div class="st-mem-main">
        <h1 class="st-mem-title" id="memory-title">Over time</h1>
        <div id="pattern"></div>
      </div>
      <div class="st-mem-side">
        <div id="next-step"></div>
        <ul class="st-convos" id="convos" aria-label="Conversations"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="stage.js"></script>
</body>
</html>
