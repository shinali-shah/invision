<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Playback</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%229%22 width=%2214%22 height=%225%22 rx=%222%22 fill=%22%232F6F66%22/%3E%3Crect x=%2214%22 y=%2218%22 width=%2214%22 height=%225%22 rx=%222%22 fill=%22%236B5B73%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* The Mac side in one place: Home plans, Live follows the phone, Replay digs into a finished
       conversation. All three stay loaded once opened, so switching is instant and nothing loses its place. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 400 16px/1.4 var(--sans); font-synthesis: none; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* The Figma's .header, .brand, .status-pill and .avatar, copied from home.css so the shell
       and the Home pane look like one page. Home hides its own header when it's in here. */
    .header { height: 68px; padding: 0 4vw; border-bottom: 1px solid #dfdfda; background: rgba(247,247,245,.94); display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); }
    .header.with-wash { background: rgba(219,231,223,.55); border-bottom-color: rgba(41,45,44,.08); }
    .brand, .header-actions, .status-pill, .sd-tabs { display: flex; align-items: center; }
    .brand { gap: 10px; font-family: var(--font-serif); font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
    .brand-mark { display: grid; place-items: center; }
    .header-actions { gap: 12px; margin-left: auto; }
    .status-pill { gap: 7px; padding: 7px 10px; font-size: 11px; font-weight: 600; color: var(--ink-2); background: #fff; border: 1px solid #deded9; border-radius: 99px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
    .avatar { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--tint); color: var(--ink-2); font-size: 11px; font-weight: 700; cursor: pointer; }
    button { font: inherit; }

    .sd-tabs { gap: 6px; position: absolute; left: 50%; transform: translateX(-50%); }
    @media (max-width: 1100px) { .sd-tabs { position: static; transform: none; } }
    .sd-tab { cursor: pointer; }
    .sd-tab:hover { color: var(--ink); }
    .sd-tab[aria-selected="true"] { color: #fff; background: var(--ink); border-color: var(--ink); }
    .sd-tab:focus-visible { outline-offset: 2px; }
    .sd-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rec); }
    .sd-dot[hidden] { display: none; }
    .sd-tab[aria-selected="true"] .sd-dot { background: #fff; }

    .sd-ready { color: var(--ink); }
    .sd-ready[hidden] { display: none; }
    .sd-ready button { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .sd-follow { cursor: pointer; }
    .sd-follow input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); }
    .sd-phone { white-space: nowrap; }
    .sd-phone[data-state="connected"], .sd-phone[data-state="recording"] { color: var(--ink); }
    .sd-phone[data-state="connected"] .status-dot { background: var(--accent); }
    .sd-phone[data-state="recording"] .status-dot { background: var(--rec); box-shadow: 0 0 0 0 rgba(200,55,45,.4); animation: rec-pulse 2s ease-out infinite; }
    .sd-phone[data-state="offline"] .status-dot { background: var(--status-amber); }
    @keyframes rec-pulse { 0% { box-shadow: 0 0 0 0 rgba(200,55,45,.4); } 80%, 100% { box-shadow: 0 0 0 6px rgba(200,55,45,0); } }
    @media (prefers-reduced-motion: reduce) { .sd-phone .status-dot { animation: none !important; } }

    .sd-panes { position: relative; flex: 1; min-height: 0; width: 100%; }
    .sd-pane { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); }
    .sd-pane[hidden] { display: none; }
    @media (max-width: 1100px) { .sd-follow { display: none; } }
    @media (max-width: 760px) { .header { padding: 0 20px; gap: 10px; } .sd-ready-text { display: none; } .avatar { display: none; } }
  </style>
</head>
<body>
  <header class="header with-wash" id="shell-header">
    <div class="brand">
      <span class="brand-mark">
        <svg width="38" height="23.56" viewBox="0 0 56 35" fill="none" aria-hidden="true">
          <path d="M28 17.500C21 6 7 4 5 17.500c2 13.500 16 11.500 23 0Z" stroke="var(--accent)" stroke-width="5.500" stroke-linejoin="round" opacity=".55"/>
          <path d="M28 17.500C35 6 49 4 51 17.500c-2 13.500-16 11.500-23 0Z" stroke="var(--accent)" stroke-width="5.500" stroke-linejoin="round"/>
          <path d="M20.500 18.500 27 13h5.500l4.500 3.500-3 5-6.500 4-3-2.500-3.500 1Z" fill="var(--paper)"/>
          <path d="M22 17.500 27.500 13H32l3.500 3.500" stroke="var(--accent)" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m23 21.500 2.500 2.500M26 20l2.500 2.500M29 18.500l2.500 2.500" stroke="var(--accent)" stroke-width="1.800" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Playback</span>
    </div>
    <nav class="sd-tabs" role="tablist" aria-label="Sections">
      <button class="status-pill sd-tab" role="tab" id="tab-home" aria-controls="pane-home" aria-selected="true">Home</button>
      <button class="status-pill sd-tab" role="tab" id="tab-live" aria-controls="pane-live" aria-selected="false" tabindex="-1">Live</button>
      <button class="status-pill sd-tab" role="tab" id="tab-replay" aria-controls="pane-replay" aria-selected="false" tabindex="-1">Replay<span class="sd-dot" id="replay-dot" hidden></span></button>
    </nav>
    <div class="header-actions">
      <span class="status-pill sd-ready" id="ready" hidden>
        <span class="sd-ready-text" id="ready-text"></span>
        <button type="button" id="ready-open">Open replay</button>
      </span>
      <label class="status-pill sd-follow"><input type="checkbox" id="auto"> Open Replay when a video is ready</label>
      <span class="status-pill sd-phone" id="phone" data-state="waiting" role="status"><span class="status-dot"></span>Waiting for your phone</span>
      <button class="avatar" aria-label="Open your profile">PS</button>
    </div>
  </header>
  <div class="sd-panes">
    <iframe class="sd-pane" id="pane-home" role="tabpanel" aria-labelledby="tab-home" title="Home"></iframe>
    <iframe class="sd-pane" id="pane-live" role="tabpanel" aria-labelledby="tab-live" title="Live" hidden></iframe>
    <iframe class="sd-pane" id="pane-replay" role="tabpanel" aria-labelledby="tab-replay" title="Replay" hidden></iframe>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    const withTheme = (path, extra = {}) => {
      const q = new URLSearchParams(extra);
      if (theme) q.set('theme', theme);
      const s = q.toString();
      return s ? `${path}?${s}` : path;
    };

    const ORDER = ['home', 'live', 'replay'];
    const panes = { home: $('pane-home'), live: $('pane-live'), replay: $('pane-replay') };
    const pages = { home: 'home.html', live: 'stage.html' };
    let current = 'home';
    let replayId = null; // what the Replay pane was last pointed at
    let readyId = null;

    function openReplay(id) {
      // Show first: a page laid out inside a hidden frame thinks the window is 0 px wide.
      const reload = id !== replayId || !panes.replay.src;
      replayId = id;
      show('replay');
      if (reload) panes.replay.src = withTheme('replay.html', id ? { id } : {});
    }

    function show(name) {
      current = name;
      for (const [key, pane] of Object.entries(panes)) {
        pane.hidden = key !== name;
        const tab = $(`tab-${key}`);
        tab.setAttribute('aria-selected', String(key === name));
        tab.tabIndex = key === name ? 0 : -1;
      }
      // Same reason as above: load Home and Live the first time they're actually on screen.
      if (pages[name] && !panes[name].src) panes[name].src = withTheme(pages[name]);
      // Home's wash runs up behind the header; the other panes sit on plain paper.
      $('shell-header').classList.toggle('with-wash', name === 'home');
      if (name === 'replay') { $('replay-dot').hidden = true; if (readyId === replayId) $('ready').hidden = true; }
      history.replaceState(null, '', `#${name}${name === 'replay' && replayId ? `=${replayId}` : ''}`);
    }

    const go = name => (name === 'replay' ? openReplay(replayId ?? readyId) : show(name));
    $('tab-home').addEventListener('click', () => show('home'));
    $('tab-live').addEventListener('click', () => show('live'));
    $('tab-replay').addEventListener('click', () => openReplay(readyId && !panes.replay.src ? readyId : replayId));
    $('ready-open').addEventListener('click', () => { if (readyId) openReplay(readyId); });

    // Arrow keys move along the tabs, as a tablist should.
    $('tab-home').parentElement.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const next = ORDER[(ORDER.indexOf(current) + (e.key === 'ArrowRight' ? 1 : ORDER.length - 1)) % ORDER.length];
      go(next);
      $(`tab-${next}`).focus();
    });
    document.addEventListener('keydown', e => {
      if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
      const i = ['1', '2', '3'].indexOf(e.key);
      if (i >= 0) go(ORDER[i]);
    });

    // Home asks for a replay by id; the panes are same-origin but this keeps them from reaching into the shell.
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'playback:open-replay') return;
      if (typeof e.data.id === 'string') openReplay(e.data.id);
    });

    // On unless they turned it off on this Mac.
    $('auto').checked = true;
    try { $('auto').checked = localStorage.getItem('playback-auto-replay') !== '0'; } catch { /* private mode */ }
    $('auto').addEventListener('change', () => { try { localStorage.setItem('playback-auto-replay', $('auto').checked ? '1' : '0'); } catch { /* fine */ } });

    // A conversation is worth replaying once it has both a video and a note.
    const announced = new Set();
    function maybeReady(c) {
      if (!c || !c.id || !c.recording || !c.note || announced.has(c.id)) return;
      announced.add(c.id);
      readyId = c.id;
      const name = c.otherName && c.otherName !== 'them' ? c.otherName.charAt(0).toUpperCase() + c.otherName.slice(1) : null;
      $('ready-text').textContent = name ? `Video with ${name} is ready` : 'Your video is ready';
      $('ready').hidden = false;
      if (current !== 'replay') $('replay-dot').hidden = false;
      if ($('auto').checked) openReplay(c.id);
    }

    // The server only hears from the phone when it does something, so "connected" means
    // it has told us what it's showing at least once since this page opened.
    let phoneSeen = false;
    function phone(stateName) {
      const el = $('phone');
      el.dataset.state = stateName;
      const text = stateName === 'recording' ? 'Recording on your phone'
        : stateName === 'connected' ? 'Phone connected'
          : stateName === 'offline' ? 'Reconnecting to this Mac'
            : 'Waiting for your phone';
      el.replaceChildren(Object.assign(document.createElement('span'), { className: 'status-dot' }), text);
    }

    function listen() {
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/stage`);
      ws.addEventListener('message', ev => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'conversation') maybeReady(msg.conversation);
        const focus = msg.type === 'focus' ? msg : msg.type === 'hello' ? msg.focus : null;
        if (focus) { phoneSeen = true; phone(focus.view === 'recording' ? 'recording' : 'connected'); }
        else if (msg.type === 'partial' || msg.type === 'turn') { phoneSeen = true; phone('recording'); }
        else if (msg.type === 'done') phone('connected');
        else if (msg.type === 'hello') phone(phoneSeen ? 'connected' : 'waiting');
      });
      ws.addEventListener('close', () => { phone('offline'); setTimeout(listen, 1500); });
    }

    // Conversations that already have a video shouldn't pop the banner on load.
    fetch('/api/conversations').then(r => r.json()).then(list => {
      for (const c of list) if (c.recording && c.note) announced.add(c.id);
    }).catch(() => {}).finally(listen);

    const [name, id] = location.hash.slice(1).split('=');
    if (name === 'replay') openReplay(id || null);
    else show(ORDER.includes(name) ? name : 'home');
  </script>
</body>
</html>
