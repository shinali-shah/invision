<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Playback</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%229%22 width=%2214%22 height=%225%22 rx=%222%22 fill=%22%232F6F66%22/%3E%3Crect x=%2214%22 y=%2218%22 width=%2214%22 height=%225%22 rx=%222%22 fill=%22%236B5B73%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* The Mac side in one place: Home plans, Live follows the phone, Replay digs into a finished
       conversation. All three stay loaded once opened, so switching is instant and nothing loses its place. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 400 16px/1.4 var(--sans); font-synthesis: none; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* The Figma v2 .header, .brand, .status-pill and .avatar (night chrome, bone text), copied from
       home.css so the shell and the Home pane look like one page. Home hides its own header in here. */
    .header { height: 72px; padding: 0 4vw; border-bottom: 1px solid var(--night-line); background: var(--night); color: var(--bone); font-size: 15px; line-height: 1.5; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: sticky; top: 0; z-index: 10; --accent: var(--marigold); }
    .header.with-wash { background: var(--night); border-bottom-color: var(--night-line); }
    .brand, .header-actions, .status-pill, .sd-tabs { display: flex; align-items: center; }
    .brand { gap: 10px; font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: .8; text-transform: uppercase; letter-spacing: -.01em; }
    .brand-mark { display: grid; place-items: center; }
    .header-actions { gap: 12px; margin-left: auto; }
    /* The Figma pill, on night: bone outline, bone text; the selected one fills bone with ink text. */
    .status-pill { gap: 7px; padding: 7px 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bone); background: transparent; border: 1.5px solid var(--bone); border-radius: 99px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bone-2); }
    .avatar { width: 40px; height: 40px; border: 1.5px solid var(--bone); border-radius: 50%; background: transparent; color: var(--bone); font-size: 11px; font-weight: 700; letter-spacing: .08em; cursor: pointer; transition: background .2s, color .2s; }
    .avatar:hover { background: var(--bone); color: var(--ink); }
    /* Same reset the Figma gets from Tailwind's preflight: no UA padding or button colour on the pills and avatar. */
    button { font: inherit; padding: 0; color: inherit; letter-spacing: inherit; }
    :focus-visible { outline: 2.5px solid var(--marigold); outline-offset: 3px; border-radius: 4px; }

    .sd-tabs { gap: 6px; position: absolute; left: 50%; transform: translateX(-50%); }
    /* The v2 pills are wide; below 1500px the centred tab group would run into the status pills, so it flows inline. */
    @media (max-width: 1500px) { .sd-tabs { position: static; transform: none; } }
    .sd-tab { cursor: pointer; transition: background .2s, color .2s; }
    .sd-tab:hover { background: rgba(233,234,230,.12); }
    .sd-tab[aria-selected="true"] { color: var(--ink); background: var(--bone); border-color: var(--bone); }
    .sd-tab:focus-visible { outline-offset: 2px; }
    .sd-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rec); }
    .sd-dot[hidden] { display: none; }
    .sd-tab[aria-selected="true"] .sd-dot { background: var(--rec); }

    .sd-ready { color: var(--bone); border-color: var(--marigold); }
    .sd-ready[hidden] { display: none; }
    .sd-ready button { padding: 0; border: 0; background: none; color: var(--marigold); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .sd-follow { cursor: pointer; color: var(--bone-2); border-color: var(--night-line); }
    .sd-follow input { width: 14px; height: 14px; margin: 0; accent-color: var(--marigold); }
    .sd-phone { white-space: nowrap; color: var(--bone-2); border-color: var(--night-line); }
    .sd-phone[data-state="connected"], .sd-phone[data-state="recording"] { color: var(--bone); border-color: var(--bone); }
    .sd-phone[data-state="connected"] .status-dot { background: var(--you-d); }
    .sd-phone[data-state="recording"] .status-dot { background: var(--rec); box-shadow: 0 0 0 0 rgba(226,65,43,.4); animation: rec-pulse 2s ease-out infinite; }
    .sd-phone[data-state="offline"] .status-dot { background: var(--marigold); }
    @keyframes rec-pulse { 0% { box-shadow: 0 0 0 0 rgba(226,65,43,.4); } 80%, 100% { box-shadow: 0 0 0 6px rgba(226,65,43,0); } }
    @media (prefers-reduced-motion: reduce) { .sd-phone .status-dot { animation: none !important; } }

    .sd-panes { position: relative; flex: 1; min-height: 0; width: 100%; }
    .sd-pane { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); }
    .sd-pane[hidden] { display: none; }
    @media (max-width: 1100px) { .sd-follow { display: none; } }
    @media (max-width: 760px) { .header { padding: 0 20px; gap: 10px; } .sd-ready-text { display: none; } .avatar { display: none; } }
  </style>
</head>
<body>
  <header class="header with-wash" id="shell-header">
    <div class="brand">
      <span class="brand-mark">
        <!-- Same mark as logoSvg() in home.js: the Figma's gold infinity with the handshake at the crossing. -->
        <svg width="56" height="24.08" viewBox="0 0 56 24" fill="none" aria-hidden="true">
          <path d="M28 12C23.2 5 17.6 3 11.5 3 6 3 3 7 3 12s3 9 8.5 9c6.1 0 11.7-2 16.5-9 4.8-7 10.4-9 16.5-9 5.5 0 8.5 4 8.5 9s-3 9-8.5 9c-6.1 0-11.7-2-16.5-9Z" stroke="#f4a51c" stroke-width="4.6" stroke-linejoin="round"/>
          <path d="M21.6 15.4l5-4.4 3.6.3 3.2 2.5-2.3 3.5-3.7 2.3-3.5-1.2Z" fill="#c4820f"/>
          <path d="M26.4 10.7l4.3-3.3 3.6.6 1.9 2.5-2.6 3-3.4-.5Z" fill="#ffc650"/>
          <path d="M24.7 17.1l1.5 1.4M26.5 15.7l1.6 1.5M28.3 14.3l1.6 1.4" stroke="#7a4f03" stroke-width=".9" stroke-linecap="round"/>
        </svg>
      </span>
      <span>Playback</span>
    </div>
    <nav class="sd-tabs" role="tablist" aria-label="Sections">
      <button class="status-pill sd-tab" role="tab" id="tab-home" aria-controls="pane-home" aria-selected="true">Home</button>
      <button class="status-pill sd-tab" role="tab" id="tab-live" aria-controls="pane-live" aria-selected="false" tabindex="-1">Live</button>
      <button class="status-pill sd-tab" role="tab" id="tab-replay" aria-controls="pane-replay" aria-selected="false" tabindex="-1">Replay<span class="sd-dot" id="replay-dot" hidden></span></button>
    </nav>
    <div class="header-actions">
      <span class="status-pill sd-ready" id="ready" hidden>
        <span class="sd-ready-text" id="ready-text"></span>
        <button type="button" id="ready-open">Open replay</button>
      </span>
      <label class="status-pill sd-follow"><input type="checkbox" id="auto"> Open Replay when a video is ready</label>
      <span class="status-pill sd-phone" id="phone" data-state="waiting" role="status"><span class="status-dot"></span>Waiting for your phone</span>
      <button class="avatar" id="avatar" aria-label="Open your profile">PS</button>
    </div>
  </header>
  <div class="sd-panes">
    <iframe class="sd-pane" id="pane-home" role="tabpanel" aria-labelledby="tab-home" title="Home"></iframe>
    <iframe class="sd-pane" id="pane-live" role="tabpanel" aria-labelledby="tab-live" title="Live" hidden></iframe>
    <iframe class="sd-pane" id="pane-replay" role="tabpanel" aria-labelledby="tab-replay" title="Replay" hidden></iframe>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme');
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    // Same name as Home: USER_NAME on the server, initials only.
    fetch('/api/me').then(r => r.json()).then(({ name }) => {
      const initials = String(name ?? '').trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() ?? '').join('');
      if (initials) $('avatar').textContent = initials;
    }).catch(() => {});
    const withTheme = (path, extra = {}) => {
      const q = new URLSearchParams(extra);
      if (theme) q.set('theme', theme);
      const s = q.toString();
      return s ? `${path}?${s}` : path;
    };

    const ORDER = ['home', 'live', 'replay'];
    const panes = { home: $('pane-home'), live: $('pane-live'), replay: $('pane-replay') };
    const pages = { home: 'home.html', live: 'stage.html' };
    let current = 'home';
    let replayId = null; // what the Replay pane was last pointed at
    let readyId = null;

    // What the Replay frame is actually showing. It navigates on its own (the list, "See all
    // replays"), so replayId alone can't be trusted.
    function replayShowing() {
      try {
        const loc = panes.replay.contentWindow.location;
        if (!loc.href || loc.href === 'about:blank') return undefined;
        return new URLSearchParams(loc.search).get('id');
      } catch { return undefined; }
    }
    panes.replay.addEventListener('load', () => {
      const id = replayShowing();
      if (id === undefined) return;
      replayId = id;
      if (current === 'replay') history.replaceState(null, '', `#replay${id ? `=${id}` : ''}`);
    });

    function openReplay(id) {
      // Show first: a page laid out inside a hidden frame thinks the window is 0 px wide.
      const reload = !panes.replay.src || id !== (replayShowing() ?? replayId);
      replayId = id;
      show('replay');
      if (reload) panes.replay.src = withTheme('replay.html', id ? { id } : {});
    }

    function show(name) {
      current = name;
      for (const [key, pane] of Object.entries(panes)) {
        pane.hidden = key !== name;
        const tab = $(`tab-${key}`);
        tab.setAttribute('aria-selected', String(key === name));
        tab.tabIndex = key === name ? 0 : -1;
      }
      // Same reason as above: load Home and Live the first time they're actually on screen.
      if (pages[name] && !panes[name].src) panes[name].src = withTheme(pages[name]);
      // Home's wash runs up behind the header; the other panes sit on plain paper.
      $('shell-header').classList.toggle('with-wash', name === 'home');
      if (name === 'replay') { $('replay-dot').hidden = true; if (readyId === replayId) $('ready').hidden = true; }
      history.replaceState(null, '', `#${name}${name === 'replay' && replayId ? `=${replayId}` : ''}`);
    }

    const go = name => (name === 'replay' ? openReplay(replayId ?? readyId) : show(name));
    $('tab-home').addEventListener('click', () => show('home'));
    $('tab-live').addEventListener('click', () => show('live'));
    $('tab-replay').addEventListener('click', () => openReplay(readyId && !panes.replay.src ? readyId : replayId));
    $('ready-open').addEventListener('click', () => { if (readyId) openReplay(readyId); });

    // Arrow keys move along the tabs, as a tablist should.
    $('tab-home').parentElement.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const next = ORDER[(ORDER.indexOf(current) + (e.key === 'ArrowRight' ? 1 : ORDER.length - 1)) % ORDER.length];
      go(next);
      $(`tab-${next}`).focus();
    });
    // Key events don't cross an iframe boundary, so once they've clicked into a pane the shortcuts
    // would go dead. Listen inside each pane too (same origin); typing fields are left alone.
    function hotkeys(e) {
      const t = e.target;
      if (t && t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const i = ['1', '2', '3'].indexOf(e.key);
      if (i >= 0) go(ORDER[i]);
    }
    document.addEventListener('keydown', hotkeys);
    for (const pane of Object.values(panes)) {
      pane.addEventListener('load', () => { try { pane.contentDocument.addEventListener('keydown', hotkeys); } catch { /* cross-origin, leave it */ } });
    }

    // Home asks for a replay by id; the panes are same-origin but this keeps them from reaching into the shell.
    // Replay's "Back to overview" comes the same way: the frame goes back to its list, the shell goes Home.
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.type === 'playback:open-replay') { if (typeof e.data.id === 'string') openReplay(e.data.id); }
      else if (e.data.type === 'playback:back') { replayId = null; show('home'); }
    });

    // On unless they turned it off on this Mac.
    $('auto').checked = true;
    try { $('auto').checked = localStorage.getItem('playback-auto-replay') !== '0'; } catch { /* private mode */ }
    $('auto').addEventListener('change', () => { try { localStorage.setItem('playback-auto-replay', $('auto').checked ? '1' : '0'); } catch { /* fine */ } });

    // A conversation is worth replaying once it has both a video and a note. Until we've seen the
    // list once we can't tell a new video from an old one being re-broadcast, so stay quiet.
    const announced = new Set();
    let seeded = false;
    function seed() {
      return fetch('/api/conversations').then(r => r.json()).then(list => {
        for (const c of list) if (c.recording && c.note) announced.add(c.id);
        seeded = true;
      }).catch(() => {});
    }
    function maybeReady(c) {
      if (!seeded || !c || !c.id || !c.recording || !c.note || announced.has(c.id)) return;
      announced.add(c.id);
      readyId = c.id;
      const name = c.otherName && c.otherName !== 'them' ? c.otherName.charAt(0).toUpperCase() + c.otherName.slice(1) : null;
      $('ready-text').textContent = name ? `Video with ${name} is ready` : 'Your video is ready';
      $('ready').hidden = false;
      if (current !== 'replay') $('replay-dot').hidden = false;
      if ($('auto').checked) openReplay(c.id);
    }

    // The server only hears from the phone when it does something, so "connected" means it has
    // told us what it's showing since this page opened. The focus that comes with `hello` is just
    // the last thing the hub remembers, maybe from hours ago, so it only counts while recording.
    function phone(stateName) {
      const el = $('phone');
      el.dataset.state = stateName;
      const text = stateName === 'recording' ? 'Recording on your phone'
        : stateName === 'connected' ? 'Phone connected'
          : stateName === 'offline' ? 'Reconnecting to this Mac'
            : 'Waiting for your phone';
      el.replaceChildren(Object.assign(document.createElement('span'), { className: 'status-dot' }), text);
    }

    function listen() {
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/stage`);
      ws.addEventListener('message', ev => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'conversation') maybeReady(msg.conversation);
        if (msg.type === 'hello') {
          // Anything that became ready while we were away is old news by now.
          seed();
          phone(msg.focus && msg.focus.view === 'recording' ? 'recording' : 'waiting');
        } else if (msg.type === 'focus') phone(msg.view === 'recording' ? 'recording' : 'connected');
        else if (msg.type === 'partial' || msg.type === 'turn') phone('recording');
        else if (msg.type === 'done') phone('connected');
      });
      ws.addEventListener('close', () => { phone('offline'); setTimeout(listen, 1500); });
    }

    listen();

    // Same initials Home shows (USER_NAME on the server); "PS" is only the placeholder until it answers.
    fetch('/api/me').then(r => r.json()).then(me => {
      const words = typeof me?.name === 'string' ? me.name.trim().split(/\s+/).filter(Boolean) : [];
      const initials = words.slice(0, 2).map(w => Array.from(w)[0].toUpperCase()).join('');
      if (initials) $('avatar').textContent = initials;
    }).catch(() => {});

    const [name, id] = location.hash.slice(1).split('=');
    if (name === 'replay') openReplay(id || null);
    else show(ORDER.includes(name) ? name : 'home');
  </script>
</body>
</html>
